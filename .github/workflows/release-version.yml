name: Release version

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run checks and preview the package without publishing or creating a release
        required: true
        default: true
        type: boolean
      dist_tag:
        description: Optional npm dist-tag (defaults to latest for stable versions, alpha/beta/rc for prereleases)
        required: false
        type: string

permissions:
  contents: write # Create the GitHub release after publishing.
  id-token: write # Authenticate to npm via trusted publishing.

concurrency:
  group: npm-release
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - name: Read package version and select npm dist-tag
        env:
          DIST_TAG: ${{ inputs.dist_tag }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const version = require('./package.json').version;
          const parsed = version.match(/^\d+\.\d+\.\d+(?:-([0-9A-Za-z-]+)(?:\.[0-9A-Za-z-]+)*)?(?:\+[0-9A-Za-z.-]+)?$/);
          if (!parsed) throw new Error(`Invalid release version: ${version}`);
          const prerelease = parsed[1];
          const tag = process.env.DIST_TAG || prerelease || 'latest';
          if (!/^[a-z][a-z0-9-]*$/.test(tag) || (prerelease && tag === 'latest')) {
            throw new Error(`Invalid npm dist-tag ${tag} for version ${version}`);
          }
          fs.appendFileSync(process.env.GITHUB_ENV, `RELEASE_VERSION=${version}\nPUBLISH_TAG=${tag}\nIS_PRERELEASE=${Boolean(prerelease)}\n`);
          console.log(`Releasing ${version} with npm dist-tag ${tag}`);
          NODE
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm test:eslint
      - name: Install npm with trusted publishing support
        run: npm install -g 'npm@^11.5.1'
      - run: npm pack --dry-run
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: npm publish --access public --provenance --tag "$PUBLISH_TAG"
      - name: Create GitHub release
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          args=(--target "$GITHUB_SHA" --generate-notes)
          if [ "$IS_PRERELEASE" = true ]; then
            args+=(--prerelease)
          fi
          gh release create "v$RELEASE_VERSION" "${args[@]}"
