name: Test & Validate

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
    - uses: actions/checkout@v7
    - uses: pnpm/action-setup@v6
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v7
      with:
        node-version: ${{ matrix.node-version }}
        cache: pnpm
    - run: pnpm install --frozen-lockfile
    - run: pnpm lint
    - run: pnpm test

  eslint-versions:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Enable 9 and 10 after the scope lookup fix (issue #28).
        eslint-version: [7, 8]
    steps:
    - uses: actions/checkout@v7
    - uses: actions/setup-node@v7
      with:
        node-version: 22
    - run: npm run test:eslint -- ${{ matrix.eslint-version }}

